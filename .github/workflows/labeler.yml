name: labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Reads .github/labeler.yml from the base branch; never checks out PR code.
      - uses: actions/labeler@v5
        with:
          sync-labels: false
