name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore workstream-mcp.sln

      - name: Build
        run: dotnet build workstream-mcp.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/Workstream.UnitTests --configuration Release --no-build --logger "trx;LogFileName=unit.trx"

      - name: Integration tests
        run: dotnet test tests/Workstream.IntegrationTests --configuration Release --no-build --logger "trx;LogFileName=integration.trx"

      - name: Concurrency tests (merge blocker if flaky)
        run: dotnet test tests/Workstream.ConcurrencyTests --configuration Release --no-build --logger "trx;LogFileName=concurrency.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
