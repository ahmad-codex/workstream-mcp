name: greet

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue here. If it is a bug, the commit or version you
            run and the exact tool call or request that fails help the most. Please make sure no
            MCP URL token or secret is pasted above.
          pr-message: |
            Thanks for your first pull request. CI runs the build plus unit, integration and
            concurrency tests; all must pass. CONTRIBUTING.md lists the rules reviews check
            (state machine, outbox, events table, token handling).
