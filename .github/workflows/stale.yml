name: stale

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security,good first issue,help wanted"
          exempt-pr-labels: "pinned,security"
          stale-issue-message: >
            This issue has had no activity for 60 days. It will be closed in 14 days unless
            there is new activity. Comment if it is still relevant.
          stale-pr-message: >
            This pull request has had no activity for 60 days. It will be closed in 14 days
            unless there is new activity.
          close-issue-reason: not_planned
