services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: workstream
      POSTGRES_USER: workstream
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - workstream-pg-data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    secrets:
      # postgres's docker-entrypoint.sh reads the password file as root before
      # gosu-stepping down to the `postgres` user, so the default root:root 0400
      # mount works here without any override.
      - pg_password
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workstream"]
      interval: 5s
      timeout: 5s
      retries: 10

  # PgBouncer in transaction-pool mode. The API points its Npgsql connection string at
  # pgbouncer:6432 instead of postgres:5432; pgbouncer multiplexes API connections onto
  # a smaller pool of real Postgres connections (§12.2).
  #
  # Constraints of transaction-pool mode that we satisfy:
  #   * No server-side prepared statements (Npgsql's `Max Auto Prepare` defaults to 0)
  #   * No LISTEN/NOTIFY consumers (we emit notifies but no live consumer is wired yet)
  #   * SET runs inside a transaction or via `SET LOCAL` (we don't use session SETs)
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    restart: unless-stopped
    # Override the image's default `postgres` user so the entrypoint can read
    # /run/secrets/pg_password (mounted root:root 0400 by Docker on Linux —
    # compose's per-service `mode:` override is silently ignored by the
    # deployed CLI version). Same reasoning as Dockerfile.api running as root.
    user: "0"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgbouncer/entrypoint.sh:/usr/local/bin/workstream-pgbouncer-start:ro
    secrets:
      - pg_password
    # Bypass edoburu's stock entrypoint — its CMD path differs across image versions.
    # Our script reads /run/secrets/pg_password, writes a userlist + pgbouncer.ini into
    # /tmp/pgbouncer/, and execs pgbouncer directly.
    entrypoint: ["/bin/sh", "/usr/local/bin/workstream-pgbouncer-start"]
    ports:
      - "6432:6432"   # debug only — production proxy wouldn't publish

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_started   # pgbouncer's healthcheck needs psql which the slim image lacks; service_started is enough since pgbouncer itself depends_on postgres healthy
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      WORKSTREAM_PUBLIC_BASE_URL: ${WORKSTREAM_PUBLIC_BASE_URL:-http://localhost:8080}
      # Npgsql settings tuned for pgbouncer transaction mode:
      #   * Maximum Pool Size kept modest (10) — the real connection pool is pgbouncer's
      #   * No Reset On Close=true — pgbouncer's server_reset_query handles state cleanup
      #   * Max Auto Prepare=0 — defaults already, but explicit guards against accidental flip
      # Server Compatibility Mode=NoTypeLoading — pgbouncer transaction-pool mode
      # confuses Npgsql's type-catalog query (manifests as "Reading as 'System.Object'
      # not supported for fields having DataTypeName '-'" after a postgres restart).
      # NoTypeLoading skips that catalog query at startup.
      WORKSTREAM_DB_CONNECTION: "Host=pgbouncer;Port=6432;Database=workstream;Username=workstream;Password=__from_secret__;Maximum Pool Size=10;Pooling=true;No Reset On Close=true;Max Auto Prepare=0;Server Compatibility Mode=NoTypeLoading"
      WORKSTREAM_DB_PASSWORD_FILE: /run/secrets/pg_password
      WORKSTREAM_ADMIN_TOKEN_FILE: /run/secrets/admin_token
      WORKSTREAM_GH_APP_ID: ${WORKSTREAM_GH_APP_ID:-0}
      WORKSTREAM_GH_INSTALLATION_ID: ${WORKSTREAM_GH_INSTALLATION_ID:-0}
      WORKSTREAM_GH_APP_KEY_PATH: /run/secrets/gh_app_key
      WORKSTREAM_GH_WEBHOOK_SECRET_FILE: /run/secrets/gh_webhook_secret
      WORKSTREAM_SLACK_SIGNING_SECRET_FILE: /run/secrets/slack_signing_secret
      WORKSTREAM_OTEL_ENDPOINT: ${WORKSTREAM_OTEL_ENDPOINT:-}
    secrets:
      # The api container runs as root (see Dockerfile.api comment) so the
      # default root:root 0400 mount is readable without any per-secret mode
      # override (which compose v2 silently ignores anyway).
      - pg_password
      - admin_token
      - gh_app_key
      - gh_webhook_secret
      - slack_demo
      - slack_signing_secret
    ports:
      - "127.0.0.1:8080:8080"   # localhost-only by default; deploy/docker-compose.prod.yml adds the public binding

  # Audit dispatcher. Runs the same app as `api` with WORKSTREAM_ROLE=dispatcher, so only
  # the AuditDispatchWorker is active. This image additionally carries git, tmux and the
  # Claude Code CLI. It drains audit_dispatch_log and, per queued project, launches the
  # project's audit orchestrator in a detached tmux session you can attach to:
  #   docker compose -f deploy/docker-compose.yml exec dispatcher tmux attach -t audit-<slug>
  dispatcher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dispatcher
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_started
    environment:
      WORKSTREAM_ROLE: dispatcher
      WORKSTREAM_DB_CONNECTION: "Host=pgbouncer;Port=6432;Database=workstream;Username=workstream;Password=__from_secret__;Maximum Pool Size=5;Pooling=true;No Reset On Close=true;Max Auto Prepare=0;Server Compatibility Mode=NoTypeLoading"
      WORKSTREAM_DB_PASSWORD_FILE: /run/secrets/pg_password
      WORKSTREAM_AUDIT_DISPATCH_ENABLED: "true"
      WORKSTREAM_AUDIT_DISPATCH_SCRIPT: /app/audit-dispatch.sh
      WS_REPOS_DIR: /srv/audit-repos
      # Claude Code auth for the audit runs the dispatch script launches.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    secrets:
      - pg_password
    volumes:
      # Persistent repo checkouts — cloned once, fast-forwarded on later audits.
      - audit-repos:/srv/audit-repos

secrets:
  # The `mode` for these mounts is set per-service in the long-form secrets
  # references above (the top-level secret definition's `mode` is Swarm-only
  # and rejected by compose's schema validator).
  pg_password:        { file: ./secrets/pg_password }
  admin_token:        { file: ./secrets/admin_token }
  gh_app_key:         { file: ./secrets/gh_app_key.pem }
  gh_webhook_secret:  { file: ./secrets/gh_webhook_secret }
  slack_demo:         { file: ./secrets/slack-demo }
  slack_signing_secret: { file: ./secrets/slack_signing_secret }

volumes:
  workstream-pg-data:
  audit-repos:
