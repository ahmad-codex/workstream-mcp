# Postgres tuning for workstream-mcp at v1 scale (low double-digit concurrent agents).
# Defaults from the postgres:16-alpine image are mostly fine; we tighten two things:
#   * shared_buffers / work_mem for predictable claim-path latency
#   * statement_timeout to bound runaway queries that would otherwise hold claim locks

listen_addresses = '*'
max_connections = 200
shared_buffers = 512MB
work_mem = 8MB
maintenance_work_mem = 128MB
effective_cache_size = 2GB
random_page_cost = 1.1     # SSD-friendly

# All transactions in the API are short; bound anything that hangs.
statement_timeout = '30s'
idle_in_transaction_session_timeout = '60s'

# WAL settings — moderate.
wal_compression = on
max_wal_size = 2GB
min_wal_size = 256MB

# Logging — useful in production, low volume on a healthy system.
log_min_duration_statement = 250
log_lock_waits = on
log_line_prefix = '%t [%p] %u@%d '
