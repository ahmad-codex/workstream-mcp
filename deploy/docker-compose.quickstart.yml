# Local evaluation stack: Postgres + the API, nothing else.
#
#   docker compose -f deploy/docker-compose.quickstart.yml up -d --build
#
# Or run the published image instead of building it:
#   WORKSTREAM_IMAGE=ghcr.io/ahmad-codex/workstream-mcp:latest \
#     docker compose -f deploy/docker-compose.quickstart.yml up -d --no-build
#
# No secret files, no GitHub App, no Slack, no dispatcher. Board sync and Slack outbox rows
# are still written; they simply have nowhere to go until those integrations are configured.
# The credentials below are for local use only. Do not expose this stack to a network.
# For production use deploy/docker-compose.yml (+ docker-compose.prod.yml) instead.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workstream
      POSTGRES_USER: workstream
      POSTGRES_PASSWORD: workstream-local
    volumes:
      - workstream-quickstart-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workstream"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${WORKSTREAM_IMAGE:-workstream-mcp:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WORKSTREAM_DB_CONNECTION: "Host=postgres;Port=5432;Database=workstream;Username=workstream;Password=workstream-local"
      WORKSTREAM_ADMIN_TOKEN: ${WORKSTREAM_ADMIN_TOKEN:-local-admin-token}
      WORKSTREAM_PUBLIC_BASE_URL: http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  workstream-quickstart-pg:
